<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 to File Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f7;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: #1d1d1f;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0077ed;
        }
        .error {
            color: #ff3b30;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            padding: 10px;
            background: #fff2f1;
            border-radius: 6px;
            border: 1px solid #ffccc7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Base64 to File Converter</h2>
    
    <!-- Base64 Input -->
    <div class="form-group">
        <label for="base64Input">Base64 Data:</label>
        <textarea id="base64Input" placeholder="Paste your Base64 string here (Supports pure strings or data URI scheme like 'data:image/png;base64,')"></textarea>
    </div>

    <!-- Filename Field -->
    <div class="form-group">
        <label for="fileName">Filename:</label>
        <input type="text" id="fileName" placeholder="Enter complete filename (If blank, timestamp will be used)">
    </div>

    <!-- Convert Button -->
    <button onclick="downloadBase64File()">Convert and Download</button>
    <div id="errorMsg" class="error"></div>
</div>

<script>
function downloadBase64File() {
    const errorEl = document.getElementById('errorMsg');
    errorEl.style.display = 'none';
    
    let base64String = document.getElementById('base64Input').value.trim();
    let finalFileName = document.getElementById('fileName').value.trim();

    if (!base64String) {
        showError('Please enter some Base64 data first!');
        return;
    }

    // Set filename to current timestamp if the input field is empty
    if (!finalFileName) {
        finalFileName = 'file_' + Date.now();
    }

    try {
        let mimeType = 'application/octet-stream';

        // 1. Strip Data URL prefix if it exists (e.g., data:image/png;base64,...)
        if (base64String.startsWith('data:')) {
            const matches = base64String.match(/^data:([^;]+);base64,(.*)\$/);
            if (matches && matches.length === 3) {
                mimeType = matches[1];
                base64String = matches[2]; // Extract raw base64 data only
            } else {
                showError('Invalid Data URL format. Please check the prefix.');
                return;
            }
        }

        // 2. Clean whitespace and decode base64 string to a binary string
        const cleanedBase64 = base64String.replace(/\s/g, '');
        const byteCharacters = window.atob(cleanedBase64);
        
        // 3. Convert to ArrayBuffer & Uint8Array
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);

        // 4. Wrap inside a Blob object
        const blob = new Blob([byteArray], { type: mimeType });

        // 5. Trigger simulated download
        const downloadLink = document.createElement('a');
        downloadLink.href = window.URL.createObjectURL(blob);
        downloadLink.download = finalFileName;
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        
        // Cleanup resources
        document.body.removeChild(downloadLink);
        window.URL.revokeObjectURL(downloadLink.href);

    } catch (e) {
        showError('Conversion failed. Please ensure the Base64 data is valid. Error: ' + e.message);
    }
}

function showError(msg) {
    const errorEl = document.getElementById('errorMsg');
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
}
</script>

</body>
</html>
